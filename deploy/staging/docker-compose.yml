# Apolles staging on the owner's VPS.
#
# The server does NOT run this file. Since 2026-11-23 cron runs a pinned copy, owned by root, in
# /opt/apolles-staging-deploy/ (with the pinned auto-update.sh), so that no commit on main can
# change how the server runs staging. This file is the reviewed source of that copy: the owner
# reviews a change here and then copies it to /opt by hand. Editing it in the repo, or merging a
# change to it, does not change the server (README.md, section 5). Keep the two in step.
#
# For a first install from scratch (README.md, section 1), from this folder (deploy/staging):
#   docker compose -p apolles-staging up -d --build
# All settings and secrets come from ./.env on the server (never committed; see README.md).
name: apolles-staging

services:
  apolles-staging-db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Shared live server: cap memory so staging cannot starve the other sites.
    mem_limit: 512m
    environment:
      POSTGRES_DB: apolles_staging
      POSTGRES_USER: apolles
      # Read from ./.env; compose stops with this message if it is missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/staging/.env}
    volumes:
      - apolles_staging_db:/var/lib/postgresql/data
    networks:
      - apolles_staging_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apolles -d apolles_staging"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published ports: only the app can reach the database.

  apolles-staging:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: apolles-staging-app
    restart: unless-stopped
    # Forwards stop signals to the server and reaps child processes.
    init: true
    mem_limit: 1g
    # The app needs no Linux capabilities (it runs as the image's "node" user on port 3000) and
    # may never gain new privileges. Same lines as in the pinned copy in /opt.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      # Demo mode: made-up hotels, rates and bookings, with a banner on every page, until
      # Expedia's test keys are added on the server. Then delete these two lines, and the
      # worker's below.
      SUPPLIER_MODE: fake
    depends_on:
      apolles-staging-db:
        condition: service_healthy
    networks:
      - apolles_staging_net
      # The shared Caddy proxy is on this network and reaches the app as apolles-staging:3000.
      - n8n_default
    # No published ports: traffic comes only through Caddy.
    # Staging writes set-password / reset links to this log: keep it small and short-lived.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The background worker (spec section 7): same image, separate process. It runs the daily
  # content refresh and other jobs from the Postgres job queue. Migrations are left to the app
  # container, so the worker skips the entrypoint and starts after the app has started.
  apolles-staging-worker:
    image: apolles-staging-app
    restart: unless-stopped
    init: true
    mem_limit: 256m
    # As for the app: no Linux capabilities, no new privileges (same as the pinned copy in /opt).
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      # Same supplier as the app (demo mode): the worker's jobs (booking checks, cancel
      # follow-ups, reminders) must see the same made-up bookings, not call Expedia without
      # keys. Delete together with the app's line when Expedia's test keys are added.
      SUPPLIER_MODE: fake
    entrypoint: ["node", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--import", "./prisma/ts-loader.mjs", "src/worker.ts"]
    depends_on:
      apolles-staging-db:
        condition: service_healthy
      apolles-staging:
        condition: service_started
    networks:
      - apolles_staging_net
      # Outbound access (Expedia) goes through this network, as for the app.
      - n8n_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The AI assistant connector, search only (plan 2026-11-22-mcp-search-connector; README section 7).
  # Same image, separate process: what Claude and ChatGPT connect to. Off until started with
  # `--profile assistants`. It gets NO env_file on purpose: no database address, no supplier keys,
  # no secrets (it refuses to start if one is present). It reaches the app inside the server only.
  apolles-staging-mcp:
    image: apolles-staging-app
    profiles: ["assistants"]
    restart: unless-stopped
    init: true
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      APP_ENV: staging
      # The same values the app has (compose reads them from the settings file next to this one
      # and stops if one is missing). Nothing else from that file reaches this container.
      APP_URL: ${APP_URL:?set APP_URL in the staging settings file}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?set MCP_PUBLIC_URL in the staging settings file}
      APP_INTERNAL_URL: http://apolles-staging:3000
    entrypoint: ["node", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--import", "./prisma/ts-loader.mjs", "src/mcp-server.ts"]
    depends_on:
      apolles-staging:
        condition: service_started
    networks:
      # The app, over the internal network. The database is on it too, but the connector has no
      # address or password for it.
      - apolles_staging_net
      # The shared Caddy reaches the connector as apolles-staging-mcp:3100.
      - n8n_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  apolles_staging_db:

networks:
  apolles_staging_net:
    name: apolles_staging_net
    # No route out: the database needs none (the app gets out through n8n_default).
    internal: true
  n8n_default:
    external: true
